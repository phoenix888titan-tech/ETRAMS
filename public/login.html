<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eTRAMS - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            page: '#B5BBC7',
            card: '#F0F4F8',
            sidebar: '#192337',
            primary: '#3B82F6',
            'primary-dark': '#1E40AF',
            'text-primary': '#1F2937',
            'text-secondary': '#6B7280'
          },
          fontFamily: {
            inter: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="login.css" />
</head>
<body class="font-inter bg-page text-text-primary">
  <div class="LoginPage">
    <div class="LoginCard">
      <div class="login-logo-wrap">
        <img src="etrams.jpg" alt="eTRAMS logo" class="login-logo" />
      </div>
      <h1 class="login-title">eTRAMS</h1>
      <p class="login-subtitle">eNERGY Technical Reporting Analysis Management System</p>

      <div id="login-error" class="login-error hidden"></div>

      <form id="login-form" class="login-form" novalidate>
        <label class="login-label" for="login-username">Username</label>
        <input
          type="text"
          id="login-username"
          class="login-input"
          autocomplete="username"
          placeholder="Enter your username"
          required
        />
        <label class="login-label" for="login-password">Password</label>
        <input
          type="password"
          id="login-password"
          class="login-input"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
        />
        <button type="submit" id="btn-login" class="login-submit">Sign In</button>
      </form>
    </div>
    <p class="login-footer">eTRAMS by acostec</p>
  </div>
  <script src="login.js"></script>
</body>
</html>
